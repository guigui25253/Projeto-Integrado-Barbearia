{% extends "base.html" %}{% block corpo %}
<h2>Novo agendamento</h2>
<form method="post">
<label>Cliente<select name="cliente">{% for c in clientes %}<option value="{{c.id_cliente}}">{{c.nome}}</option>{% endfor %}</select></label>
<label>Serviço<select name="servico">{% for s in servicos %}<option value="{{s.id_servico}}">{{s.descricao}} - R$ {{'%.2f'|format(s.preco)}}</option>{% endfor %}</select></label>
<label>Profissional<select name="profissional">{% for p in profissionais %}<option value="{{p.id_profissional}}">{{p.nome}}</option>{% endfor %}</select></label>
<label>Data<input name="data" type="date" value="2026-11-05" required></label>
<label>Hora<input name="hora" type="time" required></label>
<button>Confirmar agendamento</button></form>
{% endblock %}
