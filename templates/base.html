<!doctype html><html lang="pt-br"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Corte &amp; Estilo</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f4f4f6;color:#222}
nav{background:#1f2937;padding:12px 24px;display:flex;gap:18px;align-items:center}
nav a{color:#fff;text-decoration:none;font-size:15px} nav .marca{font-weight:bold;margin-right:auto;color:#fff}
main{max-width:760px;margin:24px auto;background:#fff;padding:24px;border-radius:8px}
label{display:block;margin-top:12px;font-weight:bold;font-size:14px}
input,select{width:100%;padding:8px;margin-top:4px;box-sizing:border-box;border:1px solid #bbb;border-radius:4px}
button{margin-top:16px;padding:9px 18px;background:#0f766e;color:#fff;border:0;border-radius:4px;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:16px} th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left;font-size:14px}
.ok{background:#d1fae5;padding:10px;border-radius:4px;margin-bottom:10px}
.erro{background:#fee2e2;padding:10px;border-radius:4px;margin-bottom:10px}
</style></head><body>
<nav><span class="marca">Studio Corte &amp; Estilo</span>
{% if session.logado %}<a href="/">Agenda do dia</a><a href="/clientes/novo">Clientes</a><a href="/agendar">Novo agendamento</a><a href="/sair">Sair</a>{% endif %}</nav>
<main>
{% with msgs = get_flashed_messages(with_categories=true) %}{% for cat, m in msgs %}<div class="{{cat}}">{{m}}</div>{% endfor %}{% endwith %}
{% block corpo %}{% endblock %}
</main></body></html>
